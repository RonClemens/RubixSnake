<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Rubix Snake Guide</title>
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div id="app">

  <!-- header -->
  <div id="hdr">
    <div class="hrow">
      <span style="font-size:15px;font-weight:700">🐍 Rubix Snake</span>
      <div style="display:flex;align-items:center;gap:8px">
        <span id="slbl" style="font-size:12px;color:#58a6ff;font-weight:700">Intro</span>
        <button id="kbtn" style="background:rgba(255,255,255,.08);border:1px solid #30363d;border-radius:7px;padding:4px 8px;color:#8b949e;font-size:12px">⚙</button>
      </div>
    </div>
    <div id="kpanel">
      <input id="kinput" type="password" placeholder="Anthropic API key  sk-ant-..."
        style="flex:1;padding:8px 10px;background:#0d1117;border:1px solid #30363d;border-radius:8px;color:#fff;font-size:12px;outline:none">
      <button id="ksave" style="padding:8px 12px;background:#238636;border-radius:8px;color:#fff;font-size:12px;font-weight:700">Save</button>
    </div>
    <div id="navrow">
      <button id="bbk"  style="flex:1;padding:9px;background:#0d1117;border:1.5px solid #30363d;border-radius:9px;font-size:14px;font-weight:700">← Back</button>
      <button id="bfwd" style="flex:2.5;padding:9px;background:#238636;border-radius:9px;font-size:14px;font-weight:700;color:#fff">Next Joint →</button>
    </div>
    <div id="pbar"><div id="pfill"></div></div>
  </div>

  <!-- tab bar -->
  <div id="tabs">
    <button id="tab-guide"  class="tab active">📖 Guide</button>
    <button id="tab-engine" class="tab">🔧 Moves Engine</button>
  </div>

  <!-- page content -->
  <div id="pg"></div>

</div>

<!-- Three.js -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- app modules -->
<script src="src/snake.js"></script>
<script src="src/shapes.js"></script>
<script src="src/renderer2d.js"></script>
<script src="src/renderer3d.js"></script>
<script src="src/movesEngine.js"></script>
<script src="src/app.js"></script>
</body>
</html>
